name: Deploy (new server)

# Despliega la web en el servidor nuevo (compose unificado de picopala-infra).
# Por ahora solo manual. Al hacer el cutover, añadir el trigger:
#   workflow_run: { workflows: [CI], types: [completed], branches: [main] }
# (y la condición `github.event.workflow_run.conclusion == 'success'`, como en la repo del backend).
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag (SHA) ya publicado en GHCR. Vacío = construir HEAD de main."
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DIR: /opt/picopala

jobs:
  build:
    if: inputs.image_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: |
          echo "tag=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* se incrustan en el build: se definen como Variables (no secretos) del entorno `production`.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build
    if: always() && (needs.build.result == 'success' || inputs.image_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # El token de GHCR viaja por stdin y solo vive durante este login. El script espera al health
      # check y, si falla, vuelve al tag anterior y termina con error.
      - name: Pull and restart web
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_NAME: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag || needs.build.outputs.tag }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes \
            "$USER_NAME@$HOST" \
            "APP_DIR='$APP_DIR' REGISTRY_USER='$REGISTRY_USER' IMAGE_TAG='$IMAGE_TAG' bash '$APP_DIR/scripts/deploy-service.sh' web"

      - name: Cleanup SSH material
        if: always()
        run: rm -f ~/.ssh/deploy_key
