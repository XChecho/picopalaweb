name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm lint

      # Without NEXT_PUBLIC_TURNSTILE_SITE_KEY: the e2e suite expects the no-captcha build (it builds its own captcha copy).
      - name: Build
        run: pnpm build

      # Google Chrome is preinstalled on ubuntu-latest; the runner starts the mock backend and `next start` itself.
      - name: E2E
        run: pnpm e2e
